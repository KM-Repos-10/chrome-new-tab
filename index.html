<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' https://www.google.com; style-src 'self'">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <div id="clock">00:00:00</div>
    <input placeholder="Search Google..." id="search" onkeydown="searching(event)">

    <hr>

    <div class="links-section">
      <div class="links">
        <button class="link-button" onclick="gotoLink('https://www.google.com')">
          <img src="https://www.google.com/s2/favicons?domain=google.com&sz=32" alt="Google favicon">
          Google
        </button>
        <button class="link-button" onclick="gotoLink('https://www.github.com')">
          <img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="GitHub favicon">
          GitHub
        </button>
        <button class="link-button" onclick="gotoLink('https://www.reddit.com')">
          <img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=32" alt="Reddit favicon">
          Reddit
        </button>
        <button class="link-button" onclick="gotoLink('https://www.stackoverflow.com')">
          <img src="https://www.google.com/s2/favicons?domain=stackoverflow.com&sz=32" alt="Stack Overflow favicon">
          Stack Overflow
        </button>
        <button class="link-button" id="add-link-button" type="button" aria-expanded="false" aria-controls="link-form">+ Add link</button>
        <button class="delete-button" id="delete-links-button" type="button">🗑️</button>
      </div>
    </div>

    <div id="delete-mode-overlay" class="delete-mode-overlay">
      <div class="delete-mode-modal">
        <h2>Select which link to delete</h2>
        <div id="delete-links-list" class="delete-links-list"></div>
        <div class="delete-mode-actions">
          <button id="close-delete-mode-button" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <form id="link-form" hidden>
      <h2>Add a link</h2>
      <label>
        Name
        <input name="name" type="text" required maxlength="60" autocomplete="off">
      </label>
      <label>
        Website
        <input name="url" type="text" required placeholder="https://example.com" autocomplete="url">
      </label>
      <div id="link-error" role="alert" aria-live="polite"></div>
      <div class="form-actions">
        <button class="form-button form-button-secondary" id="cancel-link-button" type="button">Cancel</button>
        <button class="form-button" type="submit">Save link</button>
      </div>
    </form>

    <hr>

    <div class="theme-controls">
      <label for="auto-theme-toggle" class="auto-theme-label">
        <input type="checkbox" id="auto-theme-toggle" aria-label="Toggle auto theme based on time">
        <span>Auto theme</span>
      </label>
      <button id="Modes" type="button" aria-label="Toggle theme" onclick="changeTheme()">Set to Light mode?</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Tab</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame-border">
    <div class="dashboard-container">
      
      <!-- Top Weather Widget -->
      <div id="weather-widget" class="weather-container">
        <span id="weather-icon">☁️</span>
        <span id="weather-temp">--°C</span>
        <span id="weather-desc" class="weather-desc">Fetching weather...</span>
      </div>

      <!-- Main Time & Date Display -->
      <div class="clock-section">
        <h1 id="clock">00:00:00</h1>
        <div id="date-display" class="date-display">Loading date...</div>
      </div>

      <!-- Search Bar -->
      <div class="search-container">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search Google..." 
         
          autocomplete="off"
        />
        <button type="button" id="image-search-button" class="image-search-btn" title="Search by image (paste, drop, or choose a file)" aria-label="Search by image">📷</button>
        <input type="file" id="image-file-input" accept="image/*" hidden />
        <div id="search-hint" class="search-hint" role="status"></div>
      </div>

      <!-- Quick Links Row -->
      <div class="links-wrapper">
        <div class="links">
          <button type="button" class="link-button" onclick="gotoLink('https://www.google.com')">
            <img src="https://www.google.com/s2/favicons?domain=google.com&sz=32" alt="" />
            Google
          </button>
          <button type="button" class="link-button" onclick="gotoLink('https://github.com')">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="" />
            GitHub
          </button>
          <button type="button" class="link-button" onclick="gotoLink('https://reddit.com')">
            <img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=32" alt="" />
            Reddit
          </button>
          <button type="button" class="link-button" onclick="gotoLink('https://stackoverflow.com')">
            <img src="https://www.google.com/s2/favicons?domain=stackoverflow.com&sz=32" alt="" />
            Stack Overflow
          </button>

          <button type="button" id="add-link-button" class="link-button add-btn" aria-expanded="false">
            + Add link
          </button>

          <button type="button" id="delete-links-button" class="link-button delete-trigger-btn" title="Manage Links">
            🗑️
          </button>
        </div>

        <!-- Add Link Form Dropdown -->
        <form id="link-form" hidden class="link-form">
          <div class="form-row">
            <input type="text" name="name" placeholder="Site Name" required />
            <input type="text" name="url" placeholder="URL (e.g. example.com)" required />
            <button type="submit" class="submit-btn">Save</button>
            <button type="button" id="cancel-link-button" class="cancel-btn">Cancel</button>
          </div>
          <div id="link-error" class="error-msg"></div>
        </form>
      </div>

    </div>

    <!-- Bottom Control Bar (Auto theme + Light Mode button grouped together) -->
    <div class="bottom-controls">
      <label class="auto-theme-wrapper" title="Automatically match system light/dark theme">
        <input type="checkbox" id="auto-theme-toggle" />
        <span class="slider"></span>
        <span class="auto-theme-label">Auto theme</span>
      </label>

      <button type="button" id="Modes" class="theme-btn" onclick="changeTheme()">
        Set to Light mode?
      </button>
    </div>
  </div>

  <!-- Delete Links Modal Overlay -->
  <div id="delete-mode-overlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Manage Custom Links</h3>
        <button type="button" id="close-delete-mode-button" class="close-btn">&times;</button>
      </div>
      <div id="delete-links-list" class="delete-links-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
